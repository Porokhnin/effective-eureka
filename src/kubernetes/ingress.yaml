apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinemaabyss-ingress
  namespace: cinemaabyss
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: cinemaabyss.example.com
      http:
        paths:
          - path: /api/movies
            pathType: Prefix
            backend:
              service:
                name: movies-service
                port:
                  number: 8081

    - host: cinemaabyss.example.com
      http:
        paths:
          - path: /api/events
            pathType: Prefix
            backend:
              service:
                name: events-service
                port:
                  number: 8082

    - host: cinemaabyss.example.com
      http:
        paths:
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: monolith
                port:
                  number: 8080

    - host: cinemaabyss.example.com
      http:
        paths:
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: monolith
                port:
                  number: 8080

    - host: cinemaabyss.example.com
      http:
        paths:
          - path: /api/subscriptions
            pathType: Prefix
            backend:
              service:
                name: monolith
                port:
                  number: 8080

    - host: cinemaabyss.example.com
      http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: monolith
                port:
                  number: 8080

    - host: cinemaabyss.example.com
      http:
        paths:
          - path: /api/proxy
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 8000
  